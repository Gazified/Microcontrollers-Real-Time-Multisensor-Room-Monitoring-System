
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
platform_packages = platformio/toolchain-xtensa-esp-elf@15.2.0+20251204
extra_scripts = post:merge_bin.py

[env:native]
platform = native
build_flags = -std=c++11 -Iinclude -Itest
build_src_filter = +<alarm.cpp> +<display.cpp> +<system_state.cpp>
test_build_src = yes
